#$direnv\
# “Home” machines: list the hostnames that belong in this class.
#[custom.home_icon]
#command = "printf ' '"
#when = 'case "$(pwd)" in /home/jimi) exit 0;; *) exit 1;; esac'
#format = "[$output]($style)"
#style = "bold blue"

# “Folder” machines: use any other hostname pattern you prefer.
[custom.folder_icon]
command = "printf ' '"
when = 'case "$(pwd)" in $HOME) exit 1;; *) exit 0;; esac'
format = "[$output ]($style)"
style = "bold cyan"

[directory]
read_only = " ro"
home_symbol = "~"
truncation_length = 0
truncate_to_repo = false
style = "bold cyan"


[os]
disabled = false
format = "[$symbol]($style) "
style = "bold white"

[os.symbols]
Redhat = ""
AlmaLinux = ""
Linux = ""
Ubuntu = ""
Windows = ""


[character]
#success_symbol = "[>](bold green)"
#error_symbol = "[x](bold red)"
vimcmd_symbol = "[<](bold green)"
vimcmd_visual_symbol = "[<](bold yellow)"
vimcmd_replace_symbol = "[<](bold purple)"
vimcmd_replace_one_symbol = "[<](bold purple)"

[git_commit]
tag_symbol = " tag "

# [git_status]
# ahead = ">"
# behind = "<"
# diverged = "<>"
# renamed = "r"
# deleted = "x"

[battery]
full_symbol = "full "
charging_symbol = "charging "
discharging_symbol = "discharging "
unknown_symbol = "unknown "
empty_symbol = "empty "



[dotnet]
format = "via [$symbol($version )(target $tfm )]($style)"
symbol = ".NET "

[status]
symbol = "[x](bold red) "
not_executable_symbol = "noexec"
not_found_symbol = "notfound"
sigint_symbol = "sigint"
signal_symbol = "sig"

[git_branch]
symbol = " "
format = "on [$symbol$branch]($style) "
style = "bold purple"

[git_status]
format = "[$all_status$ahead_behind]($style) "
style = "bold yellow"
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↑${ahead_count} ↓${behind_count}"
up_to_date = ""

# Working tree
#00D787
untracked = "[?${count}](bold fg:#005F5F)"
modified = "[!${count}](bold fg:#00D787)"
staged = "[+${count}](bold blue)"
deleted = "✘${count}"
renamed = "»${count}"
conflicted = "=${count}"